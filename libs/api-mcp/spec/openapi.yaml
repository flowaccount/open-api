              example: 3
            chequeBankAccountId:
              type: integer
              description: ธนาคารที่ระบุหน้าเช็ค <br> 1 = ธนาคารกรุงเทพ - (Bangkok Bank)<br> 2 = ธนาคารกสิกรไทย - (Kasikorn Bank)
                <br> 3 = ธนาคารกรุงไทย - (Krungthai Bank)<br> 4 = ธนาคารทหารไทย - (TMB Bank)
                <br> 5 = ธนาคารไทยพาณิชย์ - (Siam Commercial Bank) <br> 6 = ธนาคารสแตนดาร์ดชาร์เตอร์ด - (StandardChartered Bank Thai)
                <br> 7 = ธนาคารซีไอเอ็มบี ไทย - (CIMB Thai Bank) <br> 8 = ธนาคารยูโอบี - (United Overseas Bank Thai)
                <br> 9 = ธนาคารกรุงศรีอยุธยา - (Bank of Ayudhya) <br> 10 = ธนาคารออมสิน - (Government Savings Bank)
                <br> 11 = ธนาคารธนชาต - (Thanachart Bank) <br> 12 = ธนาคารแลนด์ แอนด์ เฮ้าส์ - (Landand Houses Bank)
                <br> 16 = ธนาคารเกียรตินาคิน - (Kiatnakin Bank) <br> 18 = ธนาคารซิตี้แบงก์ - (Citi bank)
                <br> 19 = ธนาคารทิสโก้ - (Tisco Bank) 
                <br> 20 = ธนาคารเพื่อการเกษตรและสหกรณ์การเกษตร - (Bank For Agriculture And Agricultural Cooperatives)
                <br> 21 = ธนาคารเพื่อการส่งออกและนำเข้าแห่งประเทศไทย - (Export Import Bank Of Thailand)
                <br> 22 = ธนาคารอาคารสงเคราะห์ - (Government Housing Bank
                <br> 23 = ธนาคารพัฒนาวิสาหกิจขนาดกลางและขนาดย่อมแห่งประเทศไทย - (SmallAnd Medium Enterprise Development Bank)
                <br> 24 = ธนาคารอิสลามแห่งประเทศไทย (Islamic Bank Of Thailand)<br> 25 = ธนาคารแห่งประเทศจีน (ไทย) - (Bank Of China)
                <br> 26 = ธนาคารไอซีบีซี (ไทย) - (Industrial And Commercial Bank Of China)
                <br> 27 = ธนาคารเมกะ สากลพาณิชย์ - (Mega International Commercial Bank)
                <br> 28 = ธนาคารซูมิโตโม มิตซุย แบงกิ้ง คอร์ปอเรชั่น - (Sumitomo Mitsui Banking Corporation)
                <br> 29 = ธนาคารมิซูโฮ จำกัด (กรุงเทพฯ) - (Mizuho Bank)
                <br> 30 = ธนาคารฮ่องกงและเซี่ยงไฮ้แบงกิ้งคอร์ปอเรชั่น - (The Hongkong and Shanghai Banking Corporation)
                <br> 31 = ธนาคารไทยเครดิต เพื่อรายย่อย - (ThaiCreditRetailBank) <br> 32 = ธนาคารดอยซ์แบงก์ - (Deutsche Bank) 
                <br> 33 = ธนาคารอินเดียนโอเวอร์ซีส์ - (Indian Overseas Bank) <br> 34 = ธนาคารแห่งอเมริกา - (Bank of America)
                <br> The value should be related with the bank name of bankAccountId
            bankAccountId:
              type: integer
              format: int64
              description: 'เลข id บัญชีธนาคารที่ใช้ชำระเงิน <br><red>สามารถ GET มาได้จาก My Company > Bank Account </red><br> <ex>Example: 12345</ex>'
              default: 0
              example: '12345'
            bankChequeId:
              type: integer
              format: int64
              description: 'id of cheque <br> The value is able to GET by go to sectionMyCompany > Bank Channel > Get list all Bank Cheque
                <a href="https://developers.flowaccount.com/api-reference/#tag/bank-channel/get/bank-channel/cheque" target="_blank">(link)</a> ,
                <br> the field name is `bankChequeId`
                <br> <ex>Example: 1234</ex>'
              default: 0
              example: '1234'
            paymentCharge:
              type: number
              format: decimal
              description: '**Limit decimal places to no more than 4 digits**
                <br> ค่าธรรมเนียม ที่ชำระโดยเช็ค <br> <ex> Example : 100.0000 </ex>'
              default: 0
          required:
            - bankAccountId
            - bankChequeId
