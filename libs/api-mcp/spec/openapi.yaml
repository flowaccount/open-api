    PaymentReceivingInSellDocument:
      type: object
      properties:
        paymentMethod:
          type: integer
          format: int64
          default: 1
        paymentDate:
          type: string
          format: date
          description: 'วันที่รับชำระเงิน / วันที่ชำระเงิน รูปแบบ yyyy-MM-dd <br> <ex>Example: 2021-01-01</ex>'
          example: '2021-01-01'
        collected:
          type: number
          format: decimal
          description: '**Limit decimal places to no more than 2 digits**
            <br> จำนวนเงินยอดรับสุทธิ <br> (The value cannot be 0)
            <br> <ex> Example : 100.00 </ex>'
          example: 100.00
        paymentDeductionType:
          type: integer
          format: int64
          description: 'ประเภทรายการปรับลด: <br> 1 = ส่วนลดพิเศษ <br> 3 = ค่านายหน้าและส่วนแบ่งการขาย
            <br> 5 = ค่าดำเนินการ <br> 7 = ปัดเศษ <br> (เฉพาะเอกสารใบกำกับภาษี/ใบเสร็จรับเงิน)'
          example: 0
        paymentDeductionAmount:
          type: number
          format: decimal
          description: '**Limit decimal places to no more than 2 digits**
            <br> จำนวนเงินยอดรายการปรับลด <br> (เฉพาะเอกสารใบกำกับภาษี/ใบเสร็จรับเงิน)'
          default: 0
        withheldPercentage:
          type: number
          format: decimal
          description: '**Limit decimal places to no more than 4 digits**
            <br> เปอร์เซ็น หัก ณ ที่จ่าย <br> 0.5 = 0.5% <br> 0.75 = 0.75% <br> 1 = 1% <br> 1.5 = 1.5% <br> 2 = 2%
            <br> 3 = 3% <br> 5 = 5% <br> 10 = 10% <br> 15 = 15% <br> -1 = จำนวนเงิน
            <red>(สำหรับเอกสารที่ใช้ภาษีแยกตามรายการสินค้า ต้องใช้เป็นจำนวนเงิน)</red>'
          example: 0
        withheldAmount:
          type: number
          format: decimal
          description: '**Limit decimal places to no more than 2 digits**
            <br> จำนวน ยอดหัก ณ ที่จ่าย <br> The value should be related with collected and withheldPercentage'
          default: 0
        paymentRemarks:
          type: string
          description: หมายเหตุ การรับชำระเงิน หรือ ชำระเงิน
          example: DocumentWithPayment
        remainingCollectedType:
          type: integer
          format: int64
          description: 'สาเหตุเงินขาด เงินเกิน <br> 51 = เงินขาดหรือเงินกิน <br> 55 = ค่าธรรมเนียมธนาคาร
            <br> Input when collected is different to grandTotal'
          default: 0
        remainingCollected:
          type: number
          format: decimal
          description: '**Limit decimal places to no more than 2 digits**
            <br> จำนวน ยอดเงินขาด หรือ เงินเกิน
            <br> The value should be related with collected and grandTotal'
          default: 0.00
          example: 100.01
      required:
        - paymentDate
        - collected
    PaymentMethodReceivingCheque:
      type: object
      properties:
        chequeDate:
          type: string
          format: date
          description: 'วันที่หน้าเช็ค รูปแบบ yyyy-MM-dd <br> <ex>Example: 2021-01-01</ex>'
          example: '2021-01-01'
        chequeNumber:
          type: string
          description: 'เลขที่เช็คธนาคาร <br> <ex>Example: 122-122-122</ex>'
          example: 122-122-122
        chequeBankAccountId:
          type: integer
          format: int64
          example: 1
      required:
        - chequeDate
        - chequeBankAccountId
    PaymentMethodReceivingTransfer:
      type: object
      properties:
        transferBankAccountId:
          type: integer
          format: int64
