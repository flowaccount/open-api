  /product-masters:
    get:
      tags:
        - Product Master
      summary: Get all Product Masters
      parameters:
        - in: query
          name: currentPage
          description: 'Query current page products item. <br> Example Pattern:
            <ex>/products?currentPage=1 </ex>
            <ex>/products?currentPage=1&pageSize=20</ex>'
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          description: 'Query products list amount per page. <br>Example Pattern:
            <ex> /products?pageSize=20 </ex>'
          schema:
            type: integer
            default: 20
        - in: query
          name: sortBy
          description: 'Product Sort By (Encode)
            <br> **name**:
            <br> name = Product master name
            <br> type = Product master type
            <br> productCode = Product master Code / SKU
            <br> categoryId = Product master category
            <br> **sortOrder**:
            <br> asc = Ascending
            <br> desc = Descending
            <br> Example Pattern: <ex> /products?sortBy=[{''name'':''productCode'',''sortOrder'':''asc''}]</ex>'
          schema:
            type: string
            default: [{'name':'name','sortOrder':'asc'}]
        - in: query
          name: filter
          description: 'Product Filter (Encode)
            <br> **columnName**:
            <br> name = Product master name
            <br> type = Product master type
            <br> productCode = Product master Code / SKU
            <br> categoryId = Product master category
            <br> Example Pattern:
            <ex> /products?filter=[{''columnName'':''categoryId'',''columnValue'':''517727'',''columnPredicateOperator'':''And''}]</ex>'
          schema:
            type: string
        - in: query
          name: searchString
          description: 'Query products name or code. <br>Example Pattern: <ex> /products?searchString=001 product </ex>'
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: Bearer accessToken
      responses:
        '200':
          description: 200 response
          content:
            application/json:
