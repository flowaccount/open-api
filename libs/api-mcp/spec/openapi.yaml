  schemas:
    AuthenResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        token_type:
          type: string
        refresh_token:
          type: string
        error:
          type: string
    Document:
      type: object
      properties:
        contactCode:
          type: string
          description: รหัส ลูกค้า/ผู้จำหน่าย
          example: '001'
        contactId:
          type: integer
          format: int64
          description: เลขที่ผู้ติดต่อ Id ลูกค้า/ผู้จำหน่าย
        contactName:
          type: string
          description: 'ชื่อ ลูกค้า/ผู้จำหน่าย <br> <ex>Example: บริษัท ลูกค้า จำกัด, คุณลูกค้า ซื้อประจำ</ex>'
          example: บริษัท ลูกค้า จำกัด, คุณลูกค้า ซื้อประจำ
        contactAddress:
          type: string
          description: ที่อยู่ ลูกค้า/ผู้จำหน่าย
          example: 'ที่อยู่ ลูกค้า/ผู้จำหน่าย'
        contactTaxId:
          type: string
          description: 'เลขประจำตัวผู้เสียภาษี ลูกค้า หรือ ผู้จำหน่าย/ลูกค้า <br> (ถ้ามีจำเป็นต้องครบ 13 หลัก)
            <br> <ex>Example: 1234567890123 </ex>'
          example: '1234567890123'
        contactBranch:
          type: string
          description: สำนักงาน/สาขา
          example: 'สำนักงาน/สาขา'
        contactPerson:
          type: string
          description: ชื่อผู้ติดต่อ
          example: 'ลูกค้า'
        contactEmail:
          type: string
          description: 'อีเมลผู้ติดต่อ <br> <ex>Example: contact@email.com</ex>'
          example: contact@email.com
        contactNumber:
          type: string
          description: 'เบอร์มือถือผู้ติดต่อ <br> <ex>Example: 099-999-9999</ex>'
          example: 099-999-9999
        contactZipCode:
          type: string
          description: รหัสไปรษณีย์ติดต่อ
          example: '12345'
        contactGroup:
          type: integer
          description: ประผู้ติดต่อ <br> 1 = บุคคลธรรมดา <br> 3 = นิติบุคคล
          default: 1
        publishedOn:
          type: string
          format: date
          description: 'วันที่เอกสาร รูปแบบ yyyy-MM-dd <br> <ex>Example: 2021-01-01</ex>'
          example: '2021-01-01'
          default: currentDate
        creditType:
          type: integer
        creditDays:
          type: integer
        dueDate:
          type: string
          format: date
        salesName:
          type: string
          description: 'ชื่อผู้สร้างเอกสาร หรือ ชื่อพนักงานขาย <br> <ex>Example: sale@email.com or Mr.Sale Shop</ex>'
          example: พนักงาน ขายหน้าร้าน
        projectName:
          type: string
          description: ชื่อโปรเจค <br> Project name (ชื่อโปรเจค) will be displayed as Project Details in the document
          example: 'project A'
        reference:
          type: string
          description: 'เลขที่อ้างอิง หรือ เลขที่เอกสารที่เกี่ยวข้อง
            <br> Reference is an information to be declared in the document, not the system document reference
            <br> <ex>Example: INV2020010001</ex>'
          example: INV2020010001
        isVatInclusive:
          type: boolean
          default: false
          description: 'Activate function of inclusive Vat for pricePerUnit
            <li> Input **true** when pricePerUnit in items is included Vat
            <li> Input **false** when pricePerUnit in items is not included Vat (excluded Vat)'
          example: false
        useReceiptDeduction:
          type: boolean
          description: เปิดใช้งานฟังก์ชั่น ปรับลดท้ายเอกสาร <br> (เฉพาะเอกสารใบกำกับภาษี / ใบเสร็จรับเงิน และ ใบเสร็จรับเงิน)
          default: false
        subTotal:
          type: number
          format: decimal
          description: '**Limit decimal places to no more than 2 digits** <br>
            มูลค่ารวมเป็นเงิน <br> The value should be the sum of pricePerUnit'
          default: 0
          example: 100.01
        discountPercentage:
          type: number
          format: decimal
          description: '**Limit decimal places to no more than 4 digits** <br>
            มูลค่าส่วนลดเป็นเปอร์เซ็นต์'
          default: 0
          example: 100.0001
        discountAmount:
          type: number
          format: decimal
          description: '**Limit decimal places to no more than 2 digits** <br>
            มูลค่าส่วนลดเป็นจำนวน (บาท)'
          default: 0
          example: 100.01
        totalAfterDiscount:
          type: number
          format: decimal
          description: '**Limit decimal places to no more than 2 digits** <br>
            มูลค่าหลังหักส่วนลด <br> The value should be the result of subTotal deducted by discountAmount'
          default: 0
          example: 10.51
        isVat:
          type: boolean
          default: false
          description: 'Activate function of document Vat calculation
            <li> Input **true**  when Vat is calculated, isVatInclusive could be input as both true or false
            <li> Input **false** when Vat is not calculated, isVatInclusive must be input as false only'
          example: false
        isManualVat:
          type: boolean
          default: false
          description: 'Activate function of manual VAT customization
            <li> Input **true** when vatRate of document is not 7%
            <li> Input **false** when vatRate of document is 7%'
          example: false
        vatAmount:
          type: number
          format: decimal
          description: '**Limit decimal places to no more than 2 digits**
            <br> The value should not exceed than totalAfterDiscount
            <br> If isVat is false, vatAmount must be input as 0 only'
          default: 0.00
          example: 10.51
        grandTotal:
          type: number
          format: decimal
          description: '**Limit decimal places to no more than 2 digits** <br>
            จำนวนเงินรวมทั้งสิ้น (รวมภาษีมูลค่าเพิ่ม 7% แล้ว)
            <br> The value should be the result of totalAfterDiscount deducted by VatAmount'
          default: 0
          example: 321.01
        documentShowWithholdingTax:
          type: boolean
          description: แสดงหรือไม่แสดง หัก ณ ที่จ่ายท้ายเอกสาร
          default: false
        documentWithholdingTaxPercentage:
          type: number
          format: decimal
          description: ภาษี ณ ที่จ่าย (%)
            <br> If documentShowWithholdingTax is false, documentWithholdingTaxPercentage must be input as 0 only
          default: 0
        documentWithholdingTaxAmount:
          type: number
          format: decimal
          description: '**Limit decimal places to no more than 2 digits** <br>
            มูลค่าภาษีหัก ณ ที่จ่าย
            <br> The value of this field will be calculated by system according to the value in
            documentWithholdingTaxPercentage, the manual value will not be displayed in the document.
            <br> If documentShowWithholdingTax is false, documentWithholdingTaxAmount must be input as 0 only'
          default: 0
        documentDeductionType:
          type: integer
          description: ประเภทรายการปรับลด <br> 1 = ส่วนลดพิเศษ <br> 3 = ค่านายหน้าและส่วนแบ่งการขาย
            <br> 5 = ค่าดำเนินการ <br> 7 = ปัดเศษ <br> (เฉพาะเอกสารใบกำกับภาษี/ใบเสร็จรับเงิน)
          default: 0
        documentDeductionAmount:
          type: number
          format: decimal
          description: จำนวนเงินยอดรายการปรับลด <br> (เฉพาะเอกสารใบกำกับภาษี/ใบเสร็จรับเงิน)
          default: 0
        remarks:
          type: string
          description: หมายเหตุเอกสาร
          example: 'remarks'
        internalNotes:
          type: string
          description: โน๊ตภายในบริษัท
          example: 'note'
        showSignatureOrStamp:
          type: boolean
          description: ลายเซ็นอิเล็กทรอนิกส์และตรายาง
          default: true
        externalDocumentId:
          type: string
          description: 'รหัสเอกสารอ้างอิงจากระบบภายนอก
            <br> <ex>Example: platform-123456</ex>'
          example: 'platform-123456'
      required:
        - contactName
        - isVatInclusive
        - totalAfterDiscount
        - isVat
        - grandTotal
        - subTotal
    InlineDocumentFields:
      type: object
      properties:
        discountType:
          type: integer
          description: รูปแบบส่วนลดในเอกสาร กรณีใช้รูปแบบ Inline ส่วนลด หรือ ภาษี แยกตามรายการสินค้า
            <br> สามารถเลือกรูปแบบส่วนลดได้ <br> 1 =  เปอร์เซ็นต์ <br> 3 = จำนวน (บาท)
            <br> Related to discountAmount in items
          default: 1
        useInlineDiscount:
          type: boolean
          description: Activate function of inline discount or discount by item
            <br> useInlineDiscount will be a fixed value as **true**
            <br> Related to discountAmount in items
          default: true
        useInlineVat:
          type: boolean
          description: Activate function of inline Vat or Vat by item
            <br> Related to vatRate in items
          default: false
        exemptAmount:
          type: number
          format: decimal
          description: '**Limit decimal places to no more than 2 digits** <br>
            Amount that is to be free from taxation
            <br> Related to vatableAmount
            <br> Tips: when useInlineVat is true, exemptAmount should be sum of total in items which vatRate is 0 or -1'
          default: 0.00
          example: 10.51
        vatableAmount:
          type: number
          format: decimal
          nullable: true
          description: '**Limit decimal places to no more than 2 digits** <br>
            Amount that is subject to taxation
            <br> The value will be automatically calculated by the system.
            <li> If isVatInclusive is **true**, vatableAmount is ( totalAfterDiscount - ExemptAmount ) - vatAmount
            <li> If isVatInclusive is **false**, vatableAmount is totalAfterDiscount - exemptAmount'
          default: 0.00
          example: 10.51
    DateFields:
      type: object
      properties:
        creditType:
          type: integer
          description: รูปแบบเครดิต <br> 1 = เครดิต (วัน) <br> 3 = เงินสด  <br> 5 = เครดิต (ไม่แสดงวันที่ครบกำหนด)
          default: 1
        creditDays:
          type: integer
          description: 'จำนวนวันที่ให้เครดิต <br> If creditType is 3 (เงินสด), creditDays will be a fixed value as 0
            <br> <ex>Example: 30</ex>'
          default: 0
          example: 30
        dueDate:
          type: string
          format: date
          description: 'Format yyyy-MM-dd
            <br> dueDate will be calculated based on publishedOn and creditDays when creditDays is inclueded in payload.
            If not, creditDays will be calculated by dueDate and publishedOn.
            <li> e.g. input creditType as 1 (เครดิตวัน), publishedOn as "2021-01-01" and creditDays is "30",
            then dueDate will be displayed as "2021-01-31" after the calculation
            <li> e.g. input creditType as 1 (เครดิตวัน), publishedOn as "2021-01-01" and dueDate as "2021-01-20",
            then creditDays will be displayed as "19" after the calculation
            <br> <ex>Example: 2021-01-01</ex>'
          example: '2021-01-31'
    DateWithPaymentFields:
      type: object
      properties:
        creditType:
          type: integer
          description: creditType will be a fixed value as 3 (เงินสด)
          default: 3
        creditDays:
          type: integer
          description: 'จำนวนวันที่ให้เครดิต <br> creditDays will be a fixed value as 0'
          default: 0
        dueDate:
          type: string
          description: 'Format yyyy-MM-dd
            <br> dueDate will be displayed as publishedOn
            <br> <ex>Example: 2021-01-01</ex>'
          example: '2021-01-01'
    SimpleDocument:
      allOf:
        - type: object
          properties:
            recordId:
              type: integer
