  /withholding-taxes:
    get:
      tags:
        - Withholding Tax
      summary: Get all withholding tax documents.
      description: เรียกดูข้อมูลเอกสารใบหัก ณ ที่จ่ายทั้งหมดในระบบ
      parameters:
        - in: query
          name: currentPage
          description: 'Query current page document withholding tax. <br>Example Pattern: <ex>/withholding-taxes?currentPage=1 </ex><ex>/withholding-taxes?currentPage=1&pageSize=20</ex>'
          schema:
            type: integer
        - in: query
          name: pageSize
          description: 'Query document withholding tax list amount per page. <br>Example Pattern: <ex> /withholding-taxes?pageSize=20 </ex>'
          schema:
            type: integer
        - in: query
          name: searchString
          description: 'Query document by Contact Name or Project Name or Document Serial. <br>Example Pattern: <ex> /withholding-taxes?searchString=WHT2021010001</ex>'
          required: false
          schema:
            type: string
        - in: query
          name: range
          description: 'Query document range type. <br>0 = all<br>1 = Current Month<br>3 = Previous Month<br>5 = Date Range<br>7 = Current Year<br>9 = Previous Year<br>15 = Fiscal Year<br>Example Query Current Month: <ex> /expenses?pageSize=20&currentPage=1&range=1</ex>'
          required: false
          schema:
            type: string
        - in: query
          name: month
          description: 'Query document by month.<br>Example Query Previous Month: <ex> /expenses?pageSize=20&currentPage=1&range=1&month=5&year=2021</ex>'
          required: false
          schema:
            type: string
        - in: query
          name: year
          description: 'Query document by year.<br>Example Query Previous Year: <ex> /expenses?currentPage=1&pageSize=20&range=9&year=2020</ex>'
          required: false
          schema:
            type: string
        - in: query
          name: startDate
          description: 'Query document by startDate to endDate.<br>Example Query Date Range: <ex> /expenses?currentPage=1&pageSize=20&range=5&startDate=2021-05-20&endDate=2021-05-22</ex>'
          required: false
          schema:
            type: string
        - in: query
          name: endDate
          description: 'Query document by startDate to endDate.<br>Example Query Date Range: <ex> /expenses?currentPage=1&pageSize=20&range=5&startDate=2021-05-20&endDate=2021-05-22</ex>'
          required: false
          schema:
            type: string
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
            default: Bearer accessToken
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllWithholidingTaxDocumentResponse'
        '401':
          description: 401 response
        '500':
          description: 500 response
    post:
      tags:
        - Withholding Tax
      summary: Create withholding tax document.
      description: 'สร้างเอกสารใบหัก ณ ที่จ่าย เมื่อสร้างสำเร็จสถานะเอกสารจะอยู่ในสถานะ ดำเนินการแล้ว (issued) <br> <br> ข้อมูลการสร้างเอกสาร หัก ณ ที่จ่าย : https://flowaccount.com/ultimateguide/guide/ภาษีเงินได้-หัก-ณ-ที่จ่าย'
      parameters:
        - name: Authorization
          in: header
          required: true
