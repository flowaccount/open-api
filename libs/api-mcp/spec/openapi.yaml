              type: string
              description: ช่องทางการขาย สำหรับ Account ที่เชื่อมต่อกับ E-commerce เมนู My Platform <br>1. Lazada <br> 2. Shopee
              example: ''
            items:
              type: array
              description: รายการสินค้าใช้งานสำหรับเอกสาร Simple
              items:
                $ref: '#/components/schemas/SimpleProductItem'
