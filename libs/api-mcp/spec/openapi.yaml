openapi: 3.0.2
servers:
  - url: https://openapi.flowaccount.com/v1
    description: Production - https://flowaccount.com
  - url: https://openapi.flowaccount.com/test
    description: Sandbox - http://sandbox-new.flowaccount.com
info:
  version: 2-oas3
  title: FlowAccount Open API
#  x-logo:
#    url: img/app-flowaccount.svg
  description: |-
    # Introduction 

    Snapshot of https://developers.flowaccount.com/swagger.yml (Postman link removed).

  termsOfService: https://flowadvance.com/policy/terms-of-use
  contact:
    email: developer_support@flowaccount.com
    url: https://www.flowaccount.com
x-tagGroups:
  - name: Sell Document
    tags:
      - Quotations
      - Billing Notes
      - Tax Invoice
      - Receipt
      - Cash Invoice
  - name: Buy Document
    tags:
      - Purchase Order
      - Receiving Inventory
  - name: Expense Document
    tags:
      - Expenses
      - Withholding Tax
  - name: Journal Entry
    tags:
      - Journal Entry
      - Chart Of Accounts
  - name: Product and Contact
    tags:
      - Product Master
      - Products
      - Contacts
  - name: My Company
    tags:
      - Business Infomation
      - Bank Channel
  - name: Authentication
    tags:
      - Authentication
paths:
  /quotations:
    get:
      tags:
        - Quotations
      summary: Get all quotations documents.
      description: เรียกดูข้อมูลเอกสารใบเสนอราคาทั้งหมดในระบบ
      parameters:
        - in: query
          name: currentPage
          description: 'Query current page document quotations. <br>Example Pattern: <ex>/quotations?currentPage=1 </ex><ex>/quotations?currentPage=1&pageSize=20</ex>'
          schema:
            type: integer
        - in: query
          name: pageSize
          description: 'Query document quotations list amount per page. <br>Example Pattern: <ex> /quotations?pageSize=20 </ex>'
          schema:
            type: integer
        - in: query
          name: searchString
          description: 'Query document by Contact Name or Project Name or Document Serial. <br>Example Pattern: <ex> /quotations?searchString=QT2021010001</ex>'
          required: false
          schema:
            type: string
        - in: query
          name: range
          description: 'Query document range type. <br>0 = all<br>1 = Current Month<br>3 = Previous Month<br>5 = Date Range<br>7 = Current Year<br>9 = Previous Year<br>15 = Fiscal Year<br>Example Query Current Month: <ex> /quotations?pageSize=20&currentPage=1&range=1</ex>'
          required: false
          schema:
            type: string
        - in: query
          name: month
          description: 'Query document by month.<br>Example Query Previous Month: <ex> /quotations?pageSize=20&currentPage=1&range=1&month=5&year=2021</ex>'
          required: false
          schema:
            type: string
        - in: query
          name: year
          description: 'Query document by year.<br>Example Query Previous Year: <ex> /quotations?currentPage=1&pageSize=20&range=9&year=2020</ex>'
          required: false
          schema:
            type: string
        - in: query
          name: startDate
          description: 'Query document by startDate to endDate.<br>Example Query Date Range: <ex> /quotations?currentPage=1&pageSize=20&range=5&startDate=2021-05-20&endDate=2021-05-22</ex>'
          required: false
          schema:
            type: string
        - in: query
          name: endDate
          description: 'Query document by startDate to endDate.<br>Example Query Date Range: <ex> /quotations?currentPage=1&pageSize=20&range=5&startDate=2021-05-20&endDate=2021-05-22</ex>'
          required: false
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: Bearer accessToken
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDocumentResponse'
        '401':
          description: 401 response
        '500':
          description: 500 response
    post:
      tags:
        - Quotations
      summary: Create quotations document.
      description: 'สร้างเอกสารใบเสนอราคา เมื่อสร้างสำเร็จสถานะเอกสารจะอยู่ในสถานะ รออนุมัติ (awaiting) <br>ข้อมูลการสร้างเอกสารใบเสนอราคา : https://flowaccount.com/ultimateguide/guide/ใบเสนอราคา'
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: Bearer accessToken
      requestBody:
        $ref: '#/components/requestBodies/SimpleDocument'
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleDocumentResponse'
        '401':
          description: 401 response
        '500':
          description: 500 response
  /quotations/inline:
    post:
      tags:
        - Quotations
      summary: Create quotations document inline discount or inline vat.
      description: 'สร้างเอกสารใบเสนอราคา แบบส่วนลด หรือ ภาษี แยกตามรายการสินค้า เมื่อสร้างสำเร็จสถานะเอกสารจะอยู่ในสถานะ รออนุมัติ (awaiting) <br>ข้อมูลการสร้างเอกสารใบเสนอราคา : https://flowaccount.com/ultimateguide/guide/ใบเสนอราคา'
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: Bearer accessToken
      requestBody:
        $ref: '#/components/requestBodies/InlineDocument'
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InlineDocumentResponse'
        '401':
          description: 401 response
        '500':
          description: 500 response
  /quotations/{id}:
    get:
      tags:
        - Quotations
      summary: Get quotations document.
      description: เรียกดูข้อมูลเอกสารใบเสนอราคาตามเลขที่เอกสารที่ต้องการ
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: Bearer accessToken
        - name: id
          in: path
          required: true
          description: ID เอกสารใช้ recordId
          schema:
            type: string
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDocumentResponse'
        '401':
          description: 401 response
        '500':
          description: 500 response
    put:
      tags:
        - Quotations
      summary: Edit quotations document.
      description: แก้ไขข้อมูลเอกสารใบเสนอราคา ตามเลขที่เอกสารที่ต้องการและเอกสารต้องเป็นสถานะ รออนุมัติ (Awaiting)
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: Bearer accessToken
        - name: id
          in: path
          required: true
          description: ID เอกสารใช้ recordId
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/UpdateAllDocument'
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '401':
          description: 401 response
        '500':
          description: 500 response
    delete:
      tags:
        - Quotations
      summary: Delete quotations document.
      description: 'ลบ เอกสารใบเสนอราคาตามเลขที่เอกสารที่ต้องการ <br> ** การลบเอกสาร เอกสารต้องอยู่ในสถานะ รออนุมัติ '
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: Bearer accessToken
        - name: id
          in: path
          required: true
          description: ID เอกสารใช้ recordId
          schema:
            type: string
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '401':
          description: 401 response
        '500':
          description: 500 response
  /quotations/{id}/status/{statusId}:
    post:
      tags:
        - Quotations
      summary: Change status quotations document.
      description: เปลี่ยนสถานะของเอกสารใบเสนอราคา สร้างเอกสารใหม่ครั้งแรกจะได้รับสถานะ รออนุมัติ (awaiting)
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: Bearer accessToken
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID เอกสารใช้ recordId
        - name: statusId
          in: path
          required: true
          schema:
            type: string
          description: เปลี่ยนสถานะเอกสารได้ 4 สถานะ <br> awaiting = รออนุมัติ <br> approved = อนุมัติ <br> approvedandprocessed = ดำเนินการแล้ว <br> rejected = ยกเลิก
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '401':
          description: 401 response
        '500':
          description: 500 response
  /quotations/{id}/attachment:
    post:
      tags:
        - Quotations
      summary: Attachment quotations document.
      description: แนบไฟล์ รูปภาพ หรือ เอกสารที่เกี่ยวข้อง ในเอกสารใบเสนอราคาตามเลขที่เอกสารที่ต้องการ
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: Bearer accessToken
        - name: id
          in: path
          required: true
          description: documentId หรือ recordId ของเอกสารที่ต้องการแนบ
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: รูปแบบ file ที่ใช้แนบในเอกสารเป็นแบบ Binary
      responses:
        '200':
          description: 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentResponse'
        '401':
          description: 401 response
        '500':
          description: 500 response
  /quotations/{id}/attachment/base64:
    post:
      tags: 
        - Quotations
