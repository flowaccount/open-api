    ExpenseDocument:
      type: object
      properties:
        contactCode:
          type: string
          description: รหัส ผู้จำหน่าย หรือ ผู้จำหน่าย/ลูกค้า
          example: '001'
        contactId:
          type: integer
          format: int64
          description: เลขที่ผู้ติดต่อ Id ผู้จำหน่าย หรือ ผู้จำหน่าย/ลูกค้า
        contactName:
          type: string
          description: ชื่อ ผู้จำหน่าย หรือ ผู้จำหน่าย/ลูกค้า
          example: บริษัท ผู้จำหน่าย จำกัด
        contactAddress:
          type: string
          description: ที่อยู่ ผู้จำหน่าย หรือ ผู้จำหน่าย/ลูกค้า
          example: 'ที่อยู่ ผู้จำหน่าย'
        contactTaxId:
          type: string
          description: 'เลขประจำตัวผู้เสียภาษี ผู้จำหน่าย หรือ ผู้จำหน่าย/ลูกค้า <br> (ถ้ามีจำเป็นต้องครบ 13 หลัก) <br> <ex>Example: 1234567890123 </ex>'
          example: '1234567890123'
        contactBranch:
          type: string
          description: สำนักงาน/สาขา
          example: 'สำนักงาน/สาขา'
        contactPerson:
          type: string
          description: ชื่อผู้ติดต่อ
          example: 'ผู้จำหน่าย'
        contactEmail:
          type: string
          description: 'อีเมลผู้ติดต่อ <br> <ex>Example: supplier@email.com</ex>'
          example: supplier@email.com
        contactNumber:
          type: string
          description: 'เบอร์มือถือผู้ติดต่อ <br> <ex>Example: 099-999-9999</ex>'
          example: 099-999-9999
        contactZipCode:
          type: string
          description: รหัสไปรษณีย์ติดต่อ
          example: '12345'
        contactGroup:
          type: integer
          default: 1
          description: ประผู้ติดต่อ <br> 1 = บุคคลธรรมดา <br> 3 = นิติบุคคล
        publishedOn:
          type: string
          format: date
          description: 'วันที่เอกสาร รูปแบบ yyyy-MM-dd <br> <ex>Example: 2021-01-01</ex>'
          example: '2021-01-01'
          default: currentDate
        creditType:
          type: integer
        creditDays:
          type: integer
        dueDate:
          type: string
          format: date
        salesName:
          type: string
          description: 'ชื่อผู้สร้างเอกสาร หรือ ชื่อพนักงานขาย <br> <ex>Example: sale@email.com or Mr.Sale Shop</ex>'
          example: พนักงาน ขายหน้าร้าน
        projectName:
          type: string
          description: ชื่อโปรเจค <br> Project name (ชื่อโปรเจค) will be displayed as Project Details in the document
          example: 'project A'
        reference:
          type: string
          description: 'เลขที่อ้างอิง หรือ เลขที่เอกสารที่เกี่ยวข้อง
            <br> Reference is an information to be declared in the document, not the system document reference
            <br> <ex>Example: INV2020010001</ex>'
          example: INV2020010001
        isVatInclusive:
          type: boolean
          description: 'Activate function of inclusive Vat for pricePerUnit
            <li> Input **true** when pricePerUnit in items is included Vat
            <li> Input **false** when pricePerUnit in items is not included Vat (excluded Vat)'
          default: false
        isManualVat:
          type: boolean
          default: false
          description: 'Activate function of manual VAT customization
            <li> Input **true** when vatRate of document is not 7%
            <li> Input **false** when vatRate of document is 7%'
          example: false
        expenseCategoryView:
          type: integer
          description: 'แสดงหมวดหมู่ค่าใช้จ่าย: <br> 1 = แสดงหมวดหมู่มุมมองนักบัญชี <br> 3 = แสดงหมวดหมู่มุมมองนักธุรกิจ'
          default: 3
        subTotal:
          type: number
          format: decimal
          description: '**Limit decimal places to no more than 2 digits** <br>
            มูลค่ารวมเป็นเงิน <br> The value should be the sum of pricePerUnit'
          default: 0
          example: 100.01
        discountPercentage:
          type: number
          format: decimal
          description: '**Limit decimal places to no more than 4 digits** <br>
            มูลค่าส่วนลดเป็นเปอร์เซ็นต์'
          default: 0
          example: 100.0001
        discountAmount:
          type: number
          format: decimal
          description: '**Limit decimal places to no more than 2 digits** <br>
            มูลค่าส่วนลดเป็นจำนวน (บาท)'
          default: 0
          example: 100.01
        totalAfterDiscount:
          type: number
          format: decimal
          description: '**Limit decimal places to no more than 2 digits** <br>
            มูลค่าหลังหักส่วนลด <br> The value should be the result of subTotal deducted by discountAmount'
          default: 0
          example: 10.51
        isVat:
          type: boolean
          description: 'Activate function of document Vat calculation
            <li> Input **true**  when Vat is calculated, isVatInclusive could be input as both true or false
            <li> Input **false** when Vat is not calculated, isVatInclusive must be input as false only'
          default: false
        vatAmount:
          type: number
          format: decimal
          description: '**Limit decimal places to no more than 2 digits**
            <br> The value should not exceed than totalAfterDiscount
            <br> If isVat is false, vatAmount must be input as 0 only'
          default: 0.00
          example: 10.51
        grandTotal:
          type: number
          format: decimal
          description: '**Limit decimal places to no more than 2 digits** <br>
            จำนวนเงินรวมทั้งสิ้น (รวมภาษีมูลค่าเพิ่ม 7% แล้ว)
            <br> The value should be the result of totalAfterDiscount deducted by VatAmount'
          default: 0
          example: 321.01
        remarks:
          type: string
          description: หมายเหตุเอกสาร
          example: 'remarks'
        internalNotes:
          type: string
          description: โน๊ตภายในบริษัท
          example: 'note'
        showSignatureOrStamp:
          type: boolean
          description: ลายเซ็นอิเล็กทรอนิกส์และตรายาง
          default: true
        externalDocumentId:
          type: string
          description: 'รหัสเอกสารอ้างอิงจากระบบภายนอก
            <br> <ex>Example: platform-123456</ex>'
          example: 'platform-123456'
      required:
        - contactName
        - isVatInclusive
        - totalAfterDiscount
        - isVat
        - grandTotal
        - subTotal
