# Append to ~/.codex/config.toml (or .codex/config.toml in a project).
# Then run once per company:  codex mcp login <name>

[mcp_servers.flowaccount-acme]
url = "https://mcp.flowaccount.com/mcp"
# Acme Trading Co., Ltd. - Main operating company (VAT registered)

[mcp_servers.flowaccount-acme-holding]
url = "https://mcp.flowaccount.com/mcp"
# Acme Holding Co., Ltd. - Holding company, accrual basis

[mcp_servers.flowaccount-sandbox]
url = "https://mcp.flowaccount.com/mcp"
# Acme Trading (sandbox copy) - Sandbox company; add "url" here to override the server URL for one company

[mcp_servers.flowaccount-acme-api]
command = "uv"
args = ["run", "--script", "/path/to/open-api/libs/api-mcp/src/server.py", "--profile", "flowaccount-acme-api"]
# Acme Trading Co., Ltd. via Open API (no login step)

[mcp_servers.flowaccount-sandbox-api]
command = "uv"
args = ["run", "--script", "/path/to/open-api/libs/api-mcp/src/server.py", "--profile", "flowaccount-sandbox-api", "--allow-write"]
# Acme Trading (sandbox copy) via Open API (no login step)
